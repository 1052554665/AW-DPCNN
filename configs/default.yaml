# 全局默认配置
experiment_name: baseline
seed: 42
device: auto

dataset:
  # root_dir: ./datasets/cwru_within
  # root_dir: ./datasets/rep_compare/cwt_gadf
  # root_dir: ./datasets/Group2_4

  root_dir: ./datasets/Group2_4_harmonic
  train_split: train
  val_split: val
  test_split: test
  img_size: 224
  batch_size: 32
  num_workers: 32
  augmentation: true
  pin_memory: true
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]

model:
  name: baseline
  num_classes: 9
  in_channels: 3
  pretrained: false

train:
  epochs: 30
  optimizer: adamw
  lr: 0.0001
  weight_decay: 0.001
  momentum: 0.9
  class_weighting: true
  print_freq: 1
  early_stopping:
    enabled: true
    patience: 15
    metric: val_f1

scheduler:
  type: plateau
  mode: max
  factor: 0.5
  patience: 5
  min_lr: 0.000001

output:
  root_dir: ./experiments/runs

visualization:
  confusion_matrix: true
  tsne: true
  roc_curve: true
