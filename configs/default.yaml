# 全局默认配置
experiment_name: baseline
seed: 42
device: auto

dataset:
  root_dir: ./datasets/transformer
  train_split: train
  val_split: val
  test_split: test
  img_size: 224
  batch_size: 32
  num_workers: 32
  augmentation: true
  pin_memory: true
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]

model:
  name: baseline
  num_classes: 30
  in_channels: 3
  pretrained: false

train:
  epochs: 10
  optimizer: adamw
  lr: 0.0001
  weight_decay: 0.001
  momentum: 0.9
  class_weighting: true
  print_freq: 1

scheduler:
  type: step
  step_size: 15
  gamma: 0.5

output:
  root_dir: ./experiments/runs

visualization:
  confusion_matrix: true
  tsne: true
