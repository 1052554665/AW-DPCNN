experiment_name: exp1_efficientnet_b0
device: cuda
model:
  name: efficientnet_b0
  num_classes: 10
  pretrained: true
train:
  epochs: 30
  lr: 1e-4
  optimizer: adamw
  weight_decay: 1e-3
scheduler:
  type: cosine
  t_max: 40
  eta_min: 0.000001
visualization:
  tsne: true
output:
  root_dir: ./experiments/exp1/efficientnet_b0
