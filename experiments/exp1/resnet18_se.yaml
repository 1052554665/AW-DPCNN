experiment_name: exp1_resnet18_se
device: cuda
model:
  name: resnet18_se
  num_classes: 4
  pretrained: true

train:
  epochs: 30
  lr: 1e-4
  optimizer: adamw
  weight_decay: 1e-3

scheduler:
  type: plateau
  mode: max
  factor: 0.5
  patience: 5
  min_lr: 0.000001

visualization:
  tsne: true

output:
  root_dir: ./experiments/exp1/resnet18_se

