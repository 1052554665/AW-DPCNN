experiment_name: exp1_vgg16_eh
device: cuda

model:
  name: vgg16_eh
  num_classes: 4
  pretrained: true

train:
  epochs: 30
  lr: 1e-4
  optimizer: adamw
  weight_decay: 1e-3

scheduler:
  type: plateau
  mode: max
  factor: 0.5
  patience: 5
  min_lr: 0.000001

visualization:
  tsne: true

output:
  root_dir: ./experiments/exp1/vgg16_eh

