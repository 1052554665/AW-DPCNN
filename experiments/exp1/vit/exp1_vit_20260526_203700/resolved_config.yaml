experiment_name: exp1_vit
seed: 42
device: auto
dataset:
  root_dir: ./dataset
  train_split: train
  val_split: val
  test_split: test
  img_size: 224
  batch_size: 32
  num_workers: 16
  augmentation: true
  pin_memory: true
  normalize_mean:
  - 0.485
  - 0.456
  - 0.406
  normalize_std:
  - 0.229
  - 0.224
  - 0.225
model:
  name: vit
  num_classes: 10
  in_channels: 3
  pretrained: false
  img_size: 224
  patch_size: 16
  embed_dim: 384
  depth: 6
  num_heads: 6
  mlp_ratio: 4.0
  dropout: 0.1
train:
  epochs: 30
  optimizer: adamw
  lr: 1e-4
  weight_decay: 1e-3
  momentum: 0.9
  class_weighting: true
  print_freq: 1
scheduler:
  type: cosine
  step_size: 15
  gamma: 0.5
  t_max: 60
  eta_min: 1.0e-06
output:
  root_dir: ./experiments/exp1/vit
visualization:
  confusion_matrix: true
  tsne: true
