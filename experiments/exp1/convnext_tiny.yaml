# python scripts/train.py     --config configs/default.yaml     --exp-config experiments/exp1/convnext_tiny.yaml

experiment_name: exp1_convnext_tiny
device: cuda

model:
  name: convnext-tiny
  num_classes: 10
  pretrained: false # ImageNet features don't help for spectrograms

train:
  epochs: 30
  lr: 1e-4
  optimizer: adamw
  weight_decay: 1e-2

scheduler:
  type: plateau
  mode: max
  factor: 0.5
  patience: 5
  min_lr: 0.000001

dropout:
  rate: 0.5

label_smoothing: 0.1

visualization:
  tsne: true

output:
  root_dir: ./experiments/experiment_result/exp1/convnext_tiny

