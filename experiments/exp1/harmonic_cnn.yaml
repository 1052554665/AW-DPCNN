experiment_name: exp1_harmonic_cnn
device: cuda

model:
  name: harmonic_cnn
  num_classes: 4
  in_channels: 3
  dropout: 0.5

train:
  epochs: 30
  lr: 1e-3
  optimizer: adamw
  weight_decay: 1e-2

scheduler:
  type: plateau
  mode: max
  factor: 0.5
  patience: 5
  min_lr: 0.000001

visualization:
  tsne: true

output:
  root_dir: ./experiments/experiment_result/exp1/harmonic_cnn
