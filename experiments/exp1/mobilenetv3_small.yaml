experiment_name: exp1_mobilenetv3_small
device: cuda

model:
  name: mobilenetv3_small
  num_classes: 5
  pretrained: false  # ImageNet features don't transfer to spectrograms

train:
  epochs: 30
  lr: 1e-4
  optimizer: adamw
  weight_decay: 1e-3

scheduler:
  type: plateau
  mode: max
  factor: 0.5
  patience: 5
  min_lr: 0.000001

visualization:
  tsne: true

output:
  root_dir: ./experiments/experiment_result/exp1/mobilenetv3_small
