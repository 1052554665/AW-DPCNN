experiment_name: exp1_MS_SE_Resnet50
device: cuda

model:
  name: MS_SE_Resnet50
  num_classes: 4
  pretrained: true

train:
  epochs: 30
  lr: 1e-6
  optimizer: adamw
  weight_decay: 1e-3

scheduler:
  type: plateau
  mode: max
  factor: 0.5
  patience: 5
  min_lr: 0.000001

visualization:
  tsne: true

output:
  root_dir: ./experiments/exp1/MS_SE_Resnet50

