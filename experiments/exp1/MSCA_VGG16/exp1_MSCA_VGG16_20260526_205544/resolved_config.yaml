experiment_name: exp1_MSCA_VGG16
seed: 42
device: cuda
dataset:
  root_dir: ./dataset
  train_split: train
  val_split: val
  test_split: test
  img_size: 224
  batch_size: 16
  num_workers: 16
  augmentation: true
  pin_memory: true
  normalize_mean:
  - 0.485
  - 0.456
  - 0.406
  normalize_std:
  - 0.229
  - 0.224
  - 0.225
model:
  name: MSCA_VGG16
  num_classes: 10
  in_channels: 3
  pretrained: true
train:
  epochs: 30
  optimizer: adamw
  lr: 1e-4
  weight_decay: 1e-3
  momentum: 0.9
  class_weighting: true
  print_freq: 1
scheduler:
  type: cosine
  step_size: 15
  gamma: 0.5
  t_max: 40
  eta_min: 1.0e-06
output:
  root_dir: ./experiments/exp1/MSCA_VGG16
visualization:
  confusion_matrix: true
  tsne: true
