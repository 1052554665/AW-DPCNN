experiment_name: exp1_baseline
device: cuda

model:
  name: baseline
  num_classes: 10
  in_channels: 3

train:
  epochs: 30
  lr: 1e-4
  optimizer: adamw
  weight_decay: 1e-3

scheduler:
  type: cosine
  t_max: 40
  eta_min: 0.000001

visualization:
  tsne: true

output:
  root_dir: ./experiments/exp1/baseline

