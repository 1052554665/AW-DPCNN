experiment_name: exp1_baseline
device: cuda

model:
  name: baseline
  num_classes: 4
  in_channels: 3

train:
  epochs: 50
  lr: 1e-4
  optimizer: adamw
  weight_decay: 1e-3

scheduler:
  type: plateau
  mode: max
  factor: 0.5
  patience: 5
  min_lr: 0.000001

visualization:
  tsne: true

output:
  root_dir: ./experiments/exp1/baseline

