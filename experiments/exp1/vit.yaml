experiment_name: exp1_vit

model:
  name: vit
  num_classes: 5
  in_channels: 3
  img_size: 224
  patch_size: 16
  embed_dim: 384
  depth: 6
  num_heads: 6
  mlp_ratio: 4.0
  dropout: 0.1

train:
  epochs: 30
  lr: 1e-4
  optimizer: adamw
  weight_decay: 1e-3

scheduler:
  type: plateau
  mode: max
  factor: 0.5
  patience: 5
  min_lr: 0.000001

visualization:
  tsne: true

output:
  root_dir: ./experiments/experiment_result/exp1/vit

