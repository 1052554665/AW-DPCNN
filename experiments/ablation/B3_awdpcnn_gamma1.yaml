experiment_name: ablation_B3_awdpcnn_gamma1
device: cuda

dataset:
  root_dir: ./datasets/ablation/awdpcnn_gamma1

model:
  name: vgg16
  num_classes: 5
  pretrained: true

train:
  epochs: 30
  lr: 1e-4
  optimizer: adamw
  weight_decay: 1e-3

scheduler:
  type: plateau
  mode: max
  factor: 0.5
  patience: 5
  min_lr: 0.000001

visualization:
  tsne: true

output:
  root_dir: ./experiments/experiment_result/ablation/B3_awdpcnn_gamma1
