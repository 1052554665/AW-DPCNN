experiment_name: rep_compare_msca_vgg16_mel_gasf
seed: 42
device: auto
dataset:
  root_dir: /home/yangchen/git_clone/AW-DPCNN/datasets/rep_compare/mel_gasf
  train_split: train
  val_split: val
  test_split: test
  img_size: 224
  batch_size: 32
  num_workers: 32
  augmentation: true
  pin_memory: true
  normalize_mean:
  - 0.485
  - 0.456
  - 0.406
  normalize_std:
  - 0.229
  - 0.224
  - 0.225
model:
  name: msca_vgg16
  num_classes: 5
  in_channels: 3
  pretrained: false
train:
  epochs: 30
  optimizer: adamw
  lr: 0.0001
  weight_decay: 0.001
  momentum: 0.9
  class_weighting: true
  print_freq: 1
  early_stopping:
    enabled: true
    patience: 15
    metric: val_f1
scheduler:
  type: plateau
  mode: max
  factor: 0.5
  patience: 5
  min_lr: 1.0e-06
output:
  root_dir: /home/yangchen/git_clone/AW-DPCNN/experiments/rep_compare_results/msca_vgg16/mel_gasf/seed42
visualization:
  confusion_matrix: true
  tsne: false
  roc_curve: false
