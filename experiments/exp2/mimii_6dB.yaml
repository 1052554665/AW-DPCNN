# python scripts/train.py \
#     --config configs/default.yaml \
#     --exp-config experiments/exp2/mimii_6dB.yaml \
#     --dataset mimii_6dB \
#     --output-root experiments/experiment_result/exp2
#
# MIMII 6dB — Binary Normal/Abnormal Classification
# Higher background noise level tests robustness to SNR variation.

experiment_name: exp2_mimii_6dB
device: cuda

model:
  name: msca-vgg16
  num_classes: 2             # normal, abnormal
  pretrained: false
  use_ms: true
  use_ca: true
  use_eh: true

train:
  epochs: 30
  lr: 1e-3
  optimizer: adamw
  weight_decay: 3e-3
  class_weighting: true
  early_stopping:
    enabled: true
    patience: 15
    metric: val_f1

scheduler:
  type: plateau
  mode: max
  factor: 0.5
  patience: 5
  min_lr: 0.000001

dropout:
  rate: 0.5

visualization:
  tsne: true
  confusion_matrix: true
  roc_curve: true
